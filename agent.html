<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>净垢灵 · 客服工作台</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* 客服后台专属样式 · 专业深色主题（覆盖 styles.css 的设计 token） */
    :root {
      --c-primary: #2BB89F;
      --c-primary-strong: #3FC9AE;
      --c-primary-deep: #1E9E88;
      --c-primary-soft: rgba(43, 184, 159, .14);
      --c-primary-ghost: rgba(43, 184, 159, .08);
      --c-bg: #0B1117;
      --c-surface: #121A22;
      --c-surface-2: #0E151C;
      --c-surface-3: #1A252E;
      --c-border: #1F2B35;
      --c-border-strong: #2B3A46;
      --c-text: #E6EDF3;
      --c-text-sub: #8A99A7;
      --c-danger: #FF6B6B;
      --shadow-soft: 0 1px 3px rgba(0, 0, 0, .30);
      --shadow-lift: 0 10px 30px rgba(0, 0, 0, .45);
    }
    body { background: var(--c-bg); color: var(--c-text); }

    /* ============ 登录视图 ============ */
    .auth {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(900px 560px at 50% -10%, rgba(43, 184, 159, .16), transparent 60%),
        radial-gradient(640px 420px at 90% 110%, rgba(43, 184, 159, .08), transparent 55%), var(--c-bg);
    }
    .auth__card {
      width: 100%; max-width: 380px; background: var(--c-surface);
      border: 1px solid var(--c-border); border-radius: 20px;
      padding: 40px 36px; box-shadow: var(--shadow-lift);
    }
    .auth__logo {
      width: 52px; height: 52px; border-radius: 14px; margin-bottom: 20px;
      background: linear-gradient(135deg, var(--c-primary), var(--c-primary-strong));
      display: grid; place-items: center; color: #06251F;
      box-shadow: 0 8px 20px rgba(43, 184, 159, .28);
    }
    .auth__logo svg { width: 28px; height: 28px; }
    .auth h1 { font-size: 22px; margin-bottom: 6px; color: var(--c-text); letter-spacing: .5px; }
    .auth .sub { font-size: 14px; color: var(--c-text-sub); margin-bottom: 28px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; color: var(--c-text-sub); margin-bottom: 8px; }
    .field input {
      width: 100%; border: 1px solid var(--c-border); border-radius: 12px;
      padding: 12px 14px; font-size: 15px; outline: none; background: var(--c-bg); color: var(--c-text);
      transition: border-color .2s, box-shadow .2s;
    }
    .field input::placeholder { color: #55636F; }
    .field input:focus { border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(43, 184, 159, .18); }
    .auth .err { color: var(--c-danger); font-size: 13px; min-height: 20px; margin-bottom: 10px; }
    .auth__btn {
      width: 100%; padding: 13px; background: linear-gradient(135deg, var(--c-primary), var(--c-primary-strong));
      color: #06251F; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: transform .15s, box-shadow .2s, filter .2s;
    }
    .auth__btn:hover { filter: brightness(1.05); box-shadow: 0 8px 20px rgba(43, 184, 159, .28); }
    .auth__btn:active { transform: translateY(1px); }
    .auth__hint { margin-top: 20px; font-size: 12px; color: var(--c-text-sub); text-align: center; line-height: 1.7; }

    /* ============ 工作台视图 ============ */
    .work { min-height: 100vh; display: none; flex-direction: column; }
    .work.on { display: flex; }
    .work__bar {
      height: 64px; background: var(--c-surface); border-bottom: 1px solid var(--c-border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .work__brand { display: flex; align-items: center; gap: 12px; }
    .work__brand .dot {
      width: 34px; height: 34px; border-radius: 10px; color: #06251F; font-size: 15px; font-weight: 700;
      background: linear-gradient(135deg, var(--c-primary), var(--c-primary-strong));
      display: grid; place-items: center; box-shadow: 0 4px 12px rgba(43, 184, 159, .24);
    }
    .work__title { font-weight: 700; font-size: 16px; color: var(--c-text); letter-spacing: .3px; }
    .work__status {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--c-primary);
      background: var(--c-primary-soft); border: 1px solid rgba(43, 184, 159, .25);
      padding: 4px 10px; border-radius: 999px;
    }
    .work__status-dot { width: 7px; height: 7px; border-radius: 50%; background: #37D0A8; box-shadow: 0 0 0 0 rgba(55, 208, 168, .7); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(55, 208, 168, .55); } 70% { box-shadow: 0 0 0 6px rgba(55, 208, 168, 0); } 100% { box-shadow: 0 0 0 0 rgba(55, 208, 168, 0); } }
    .work__logout {
      font-size: 13px; color: var(--c-text-sub); border: 1px solid var(--c-border);
      padding: 7px 16px; border-radius: 999px; cursor: pointer; background: var(--c-surface);
      transition: color .2s, border-color .2s, background .2s;
    }
    .work__logout:hover { color: var(--c-text); border-color: var(--c-border-strong); }

    .work__layout {
      flex: 1; display: grid; grid-template-columns: 304px 1fr;
      gap: 1px; background: var(--c-border); height: calc(100vh - 64px);
    }
    .sessions { background: var(--c-surface-2); overflow-y: auto; padding: 10px; }
    .sessions__head {
      padding: 12px 8px 14px; font-size: 12px; color: var(--c-text-sub); font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .sessions__clear {
      font-size: 12px; color: var(--c-text-sub); border: 1px solid var(--c-border);
      padding: 4px 10px; border-radius: 999px; cursor: pointer; background: var(--c-surface);
      transition: color .2s, border-color .2s; text-transform: none; letter-spacing: 0; font-weight: 400;
    }
    .sessions__clear:hover { color: var(--c-danger); border-color: var(--c-danger); }
    .sess {
      width: 100%; text-align: left; background: var(--c-surface); border: 1px solid var(--c-border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      position: relative;
    }
    .sess:hover { border-color: var(--c-border-strong); }
    .sess.active { border-color: var(--c-primary); background: linear-gradient(180deg, rgba(43,184,159,.10), rgba(43,184,159,.04)); }
    .sess.active::before {
      content: ''; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 3px;
      border-radius: 0 3px 3px 0; background: var(--c-primary);
    }
    .sess__top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .sess__name { font-weight: 600; font-size: 14px; color: var(--c-text); }
    .sess__time { font-size: 11px; color: var(--c-text-sub); flex-shrink: 0; }
    .sess__line {
      display: inline-block; font-size: 11px; color: var(--c-primary); background: var(--c-primary-soft);
      border: 1px solid rgba(43, 184, 159, .22); border-radius: 6px; padding: 1px 7px; margin-bottom: 7px;
    }
    .sess__preview {
      font-size: 12px; color: var(--c-text-sub); display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
    }
    .sess__tag {
      display: inline-block; font-size: 10px; color: #FFB347; background: rgba(255, 179, 71, .14);
      border: 1px solid rgba(255, 179, 71, .28); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
    }
    .sess__phone {
      display: inline-block; font-size: 11px; color: var(--c-primary); background: var(--c-primary-soft);
      border: 1px solid rgba(43, 184, 159, .22); border-radius: 6px; padding: 1px 7px; margin-bottom: 7px;
    }
    .empty { padding: 40px 24px; text-align: center; color: var(--c-text-sub); font-size: 13px; line-height: 1.7; }

    /* ============ 实时监控面板 ============ */
    .monitor {
      display: flex; gap: 0; padding: 0; background: var(--c-surface-2);
      border-bottom: 1px solid var(--c-border); overflow-x: auto;
    }
    .monitor__item {
      flex: 1; padding: 10px 14px; border-right: 1px solid var(--c-border);
      display: flex; flex-direction: column; gap: 2px; min-width: 0;
    }
    .monitor__item:last-child { border-right: none; }
    .monitor__label { font-size: 11px; color: var(--c-text-sub); white-space: nowrap; }
    .monitor__value { font-size: 14px; font-weight: 600; color: var(--c-text); white-space: nowrap; }
    .monitor__value--ok { color: var(--c-primary); }
    .monitor__value--warn { color: #FFB347; }
    .monitor__value--danger { color: var(--c-danger); }
    .monitor__dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px;
      vertical-align: middle;
    }
    .monitor__dot--ok { background: var(--c-primary); box-shadow: 0 0 0 2px rgba(43, 184, 159, .2); }
    .monitor__dot--warn { background: #FFB347; box-shadow: 0 0 0 2px rgba(255, 179, 71, .2); }
    .monitor__dot--danger { background: var(--c-danger); box-shadow: 0 0 0 2px rgba(255, 107, 107, .2); }

    /* ============ 聊天区 ============ */
    .chat { background: var(--c-surface); display: flex; flex-direction: column; min-width: 0; }
    .chat__head {
      padding: 16px 22px; border-bottom: 1px solid var(--c-border); font-weight: 600; font-size: 15px; color: var(--c-text);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    /* ============ 多标签页 ============ */
    .tabs {
      display: flex; gap: 4px; padding: 6px 8px 0; background: var(--c-surface);
      border-bottom: 1px solid var(--c-border); overflow-x: auto; scrollbar-width: thin;
    }
    .tabs::-webkit-scrollbar { height: 3px; }
    .tabs::-webkit-scrollbar-thumb { background: var(--c-border-strong); border-radius: 2px; }
    .tab {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 14px;
      font-size: 13px; color: var(--c-text-sub); background: var(--c-surface-2);
      border: 1px solid var(--c-border); border-bottom: none; border-radius: 8px 8px 0 0;
      cursor: pointer; white-space: nowrap; position: relative; transition: color .2s, background .2s, border-color .2s;
      max-width: 200px;
    }
    .tab:hover { color: var(--c-text); border-color: var(--c-border-strong); }
    .tab.active {
      color: var(--c-text); background: var(--c-bg); border-color: var(--c-primary);
    }
    .tab.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--c-bg);
    }
    .tab__name { overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
    .tab__close {
      width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center;
      color: var(--c-text-sub); font-size: 14px; line-height: 1; flex: none; transition: color .15s, background .15s;
    }
    .tab__close:hover { color: var(--c-danger); background: rgba(255, 107, 107, .14); }
    .tab__dot {
      width: 6px; height: 6px; border-radius: 50%; background: #FF6B6B; flex: none;
      box-shadow: 0 0 0 2px rgba(255, 107, 107, .2);
    }
    .chat__presence { font-size: 12px; font-weight: 400; color: var(--c-text-sub); display: inline-flex; align-items: center; gap: 6px; }
    .chat__presence i { width: 6px; height: 6px; border-radius: 50%; background: #37D0A8; }
    .chat__body {
      flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;
      background:
        radial-gradient(720px 400px at 100% 0%, rgba(43,184,159,.05), transparent 55%), var(--c-bg);
    }
    .bubble {
      max-width: 72%; padding: 8px 12px; border-radius: 6px; font-size: 14px; line-height: 1.6;
      word-break: break-word; position: relative; animation: bubbleIn .28s ease; box-shadow: var(--shadow-soft);
    }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .bubble--customer { align-self: flex-start; background: var(--c-surface-3); border: 1px solid var(--c-border); border-bottom-left-radius: 4px; color: var(--c-text); }
    .bubble--customer::after {
      content: ''; position: absolute; left: -7px; bottom: 11px; width: 0; height: 0;
      border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 7px solid var(--c-surface-3);
    }
    .bubble--agent {
      align-self: flex-end; background: linear-gradient(135deg, var(--c-primary), var(--c-primary-deep));
      color: #04211B; border-bottom-right-radius: 4px;
    }
    .bubble--agent::after {
      content: ''; position: absolute; right: -7px; bottom: 11px; width: 0; height: 0;
      border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 7px solid var(--c-primary-deep);
    }
    .bubble--sys {
      align-self: center; font-size: 12px; color: var(--c-text-sub); background: var(--c-surface-2);
      border: 1px dashed var(--c-border-strong); padding: 6px 14px; max-width: 85%; box-shadow: none;
    }
    .bubble__meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; font-size: 11px; line-height: 1.2; }
    .bubble__sender { font-weight: 600; opacity: .9; }
    .bubble__time { opacity: .6; }
    .bubble--agent .bubble__meta { color: rgba(4, 33, 27, .72); }
    .bubble--customer .bubble__meta { color: var(--c-text-sub); }
    .bubble--sys .bubble__meta { color: var(--c-text-sub); }
    .bubble__content { white-space: pre-wrap; }

    /* ============ 快捷话术 & 输入 ============ */
    .chat__quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; background: var(--c-surface); }
    .chat__quick button {
      font-size: 12px; color: var(--c-primary); background: var(--c-primary-soft);
      border: 1px solid rgba(43, 184, 159, .22); border-radius: 999px;
      padding: 6px 13px; cursor: pointer; transition: background .2s, border-color .2s, color .2s;
    }
    .chat__quick button:hover { background: var(--c-primary); color: #04211B; border-color: var(--c-primary); }
    .chat__input { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--c-border); background: var(--c-surface); align-items: center; }
    .chat__input input {
      flex: 1; border: 1px solid var(--c-border); border-radius: 12px;
      padding: 12px 16px; font-size: 14px; outline: none; background: var(--c-bg); color: var(--c-text);
      transition: border-color .2s, box-shadow .2s;
    }
    .chat__input input::placeholder { color: #55636F; }
    .chat__input input:focus { border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(43, 184, 159, .14); }
    .chat__input button {
      padding: 0 22px; height: 44px; background: linear-gradient(135deg, var(--c-primary), var(--c-primary-strong));
      color: #04211B; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: filter .2s, transform .15s, box-shadow .2s;
    }
    .chat__input button svg { width: 16px; height: 16px; }
    .chat__input button:hover { filter: brightness(1.05); box-shadow: 0 6px 16px rgba(43, 184, 159, .3); }
    .chat__input button:active { transform: translateY(1px); }
    .chat__input button:disabled { opacity: .45; cursor: not-allowed; }

    @media (max-width: 720px) {
      .work__layout { grid-template-columns: 1fr; grid-template-rows: 260px 1fr; height: auto; }
      .sessions { max-height: 260px; }
      .work__status { display: none; }
    }
  </style>
</head>
<body>
  <!-- 登录视图 -->
  <div class="auth" id="loginView">
    <div class="auth__card">
      <div class="auth__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69 17.66 8.35a8 8 0 1 1-11.32 0L12 2.69Z" /></svg>
      </div>
      <h1>净垢灵 · 客服工作台</h1>
      <p class="sub">登录后可实时响应顾客咨询</p>
      <div class="field">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号" autocomplete="off" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" />
      </div>
      <div class="err" id="loginError"></div>
      <button class="auth__btn" id="loginBtn">登录</button>
      <p class="auth__hint">演示账号：A　密码：12345678</p>
    </div>
  </div>

  <!-- 工作台视图 -->
  <div class="work" id="workView">
    <header class="work__bar">
      <div class="work__brand">
        <span class="dot">净</span>
        <span class="work__title">净垢灵客服工作台</span>
        <span class="work__status"><span class="work__status-dot"></span>在线</span>
      </div>
      <button class="work__logout" id="logoutBtn">退出登录</button>
    </header>
    <!-- 实时监控面板 -->
    <div class="monitor" id="monitorPanel">
      <div class="monitor__item"><span class="monitor__label">服务器状态</span><span class="monitor__value" id="mStatus"><span class="monitor__dot monitor__dot--ok"></span>检测中…</span></div>
      <div class="monitor__item"><span class="monitor__label">运行时长</span><span class="monitor__value" id="mUptime">—</span></div>
      <div class="monitor__item"><span class="monitor__label">会话数</span><span class="monitor__value" id="mSessions">0</span></div>
      <div class="monitor__item"><span class="monitor__label">在线连接</span><span class="monitor__value" id="mOnline">0</span></div>
      <div class="monitor__item"><span class="monitor__label">留言待回</span><span class="monitor__value" id="mLeaves">0</span></div>
      <div class="monitor__item"><span class="monitor__label">维护窗口</span><span class="monitor__value" id="mWindow">0:00–8:00</span></div>
      <div class="monitor__item"><span class="monitor__label">服务器时间</span><span class="monitor__value" id="mTime">—</span></div>
    </div>
    <div class="work__layout">
      <aside class="sessions">
        <div class="sessions__head"><span>会话列表</span><button class="sessions__clear" id="clearSessionsBtn" type="button">清空会话</button></div>
        <div id="sessionList"></div>
      </aside>
      <section class="chat">
        <div class="chat__head">
          <span id="chatTitle">请选择左侧会话</span>
          <span class="chat__presence"><i></i>实时同步</span>
        </div>
        <div class="tabs" id="tabBar"></div>
        <div class="chat__body" id="chatBody"><div class="empty">暂无消息</div></div>
        <div class="chat__quick" id="quickReplies">
          <button type="button" data-reply="您好，欢迎咨询净垢灵，请问有什么可以帮您？">您好，请问有什么可以帮您？</button>
          <button type="button" data-reply="感谢您的耐心等待，我马上为您查询。">感谢您的耐心等待</button>
          <button type="button" data-reply="好的，我已了解您的问题，请稍等一下。">好的，请稍等</button>
          <button type="button" data-reply="感谢您的咨询，祝您生活愉快！">感谢您的咨询</button>
        </div>
        <div class="chat__input">
          <input type="text" id="replyInput" placeholder="输入回复内容，回车或点击发送" autocomplete="off" />
          <button id="sendReplyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>发送</button>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    (function () {
      'use strict';

      var AUTH_KEY = 'jc_agent_auth';
      var SESSIONS_KEY = 'jc_sessions';
      var AGENT = { username: 'A', password: '12345678' };

      var currentSessionId = null;
      var openTabs = [];  // 已打开的标签页会话 ID 列表

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function readSessions() {
        try { return JSON.parse(localStorage.getItem(SESSIONS_KEY) || '{}'); } catch (e) { return {}; }
      }
      function writeSessions(s) {
        localStorage.setItem(SESSIONS_KEY, JSON.stringify(s));
        window.JC.setSessions(s);
      }
      function upsert(sess) {
        var all = readSessions();
        all[sess.id] = sess;
        writeSessions(all);
      }

      /* ---- 视图切换 ---- */
      function showWorkbench() {
        document.getElementById('loginView').style.display = 'none';
        var work = document.getElementById('workView');
        work.classList.add('on');
        // 登录后重新从服务器拉取最新会话数据
        window.JC.getSessions().then(function (all) {
          if (all && typeof all === 'object') {
            localStorage.setItem(SESSIONS_KEY, JSON.stringify(all));
          }
          renderList();
        }).catch(function () { renderList(); });
        startMonitor();
      }

      /* ---- 实时监控面板 ---- */
      var monitorTimer = null;
      function startMonitor() {
        if (monitorTimer) clearInterval(monitorTimer);
        updateMonitor();
        monitorTimer = setInterval(updateMonitor, 5000);
      }
      function updateMonitor() {
        window.JC.getStatus().then(function (s) {
          var st = document.getElementById('mStatus');
          if (s.maintenance) {
            st.innerHTML = '<span class="monitor__dot monitor__dot--warn"></span>维护中';
            st.className = 'monitor__value monitor__value--warn';
          } else {
            st.innerHTML = '<span class="monitor__dot monitor__dot--ok"></span>运行中';
            st.className = 'monitor__value monitor__value--ok';
          }
          document.getElementById('mUptime').textContent = s.uptime || '—';
          document.getElementById('mSessions').textContent = s.sessionCount || 0;
          document.getElementById('mOnline').textContent = s.onlineConnections || 0;
          var leaves = s.leaveMessageCount || 0;
          var lv = document.getElementById('mLeaves');
          lv.textContent = leaves;
          lv.className = 'monitor__value' + (leaves > 0 ? ' monitor__value--warn' : '');
          document.getElementById('mWindow').textContent = s.maintenanceWindow || '0:00–8:00';
          document.getElementById('mTime').textContent = s.serverTime || '—';
        }).catch(function () {
          var st = document.getElementById('mStatus');
          st.innerHTML = '<span class="monitor__dot monitor__dot--danger"></span>连接失败';
          st.className = 'monitor__value monitor__value--danger';
        });
      }
      function showLogin() {
        sessionStorage.removeItem(AUTH_KEY);
        document.getElementById('workView').classList.remove('on');
        document.getElementById('loginView').style.display = 'grid';
      }

      function doLogin() {
        var u = document.getElementById('username').value.trim();
        var p = document.getElementById('password').value;
        if (u === AGENT.username && p === AGENT.password) {
          sessionStorage.setItem(AUTH_KEY, '1');
          showWorkbench();
        } else {
          document.getElementById('loginError').textContent = '账号或密码错误，请重试';
        }
      }

      /* ---- 会话列表 ---- */
      function renderList() {
        var all = readSessions();
        var ids = Object.keys(all).sort(function (a, b) {
          return (all[b].updatedAt || 0) - (all[a].updatedAt || 0);
        });
        var listEl = document.getElementById('sessionList');
        if (!ids.length) {
          listEl.innerHTML = '<div class="empty">暂无会话，等待顾客咨询</div>';
          return;
        }
        listEl.innerHTML = ids.map(function (id) {
          var s = all[id];
          var last = (s.messages && s.messages.length) ? s.messages[s.messages.length - 1] : null;
          var preview = last ? last.content : '';
          var time = s.updatedAt ? new Date(s.updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
          var tag = s.type === 'leave-message' ? '留言' : '';
          var phoneInfo = s.phone ? '<span class="sess__phone">' + esc(s.phone) + '</span>' : '';
          return '<button class="sess' + (id === currentSessionId ? ' active' : '') + '" data-id="' + esc(id) + '">' +
            '<span class="sess__top"><span class="sess__name">' + esc(s.name || '顾客') + '</span>' +
            (tag ? '<span class="sess__tag">' + tag + '</span>' : '') +
            (time ? '<span class="sess__time">' + time + '</span>' : '') + '</span>' +
            (phoneInfo || (s.productLine ? '<span class="sess__line">' + esc(s.productLine) + '</span>' : '')) +
            '<span class="sess__preview">' + esc(preview) + '</span>' +
            '</button>';
        }).join('');
      }

      /* ---- 多标签页 ---- */
      function openTab(id) {
        if (openTabs.indexOf(id) === -1) openTabs.push(id);
        renderTabs();
      }
      function closeTab(id) {
        var idx = openTabs.indexOf(id);
        if (idx !== -1) openTabs.splice(idx, 1);
        if (currentSessionId === id) {
          if (openTabs.length) {
            renderChat(openTabs[Math.max(0, idx - 1)]);
          } else {
            currentSessionId = null;
            document.getElementById('chatTitle').textContent = '请选择左侧会话';
            document.getElementById('chatBody').innerHTML = '<div class="empty">暂无消息</div>';
          }
        }
        renderTabs();
      }
      function renderTabs() {
        var bar = document.getElementById('tabBar');
        if (!openTabs.length) { bar.innerHTML = ''; bar.style.display = 'none'; return; }
        bar.style.display = 'flex';
        var all = readSessions();
        bar.innerHTML = openTabs.map(function (id) {
          var s = all[id];
          if (!s) { closeTab(id); return ''; }
          var name = s.name || '顾客';
          // 检测未回复：最后一条消息来自顾客则显示红点
          var msgs = s.messages || [];
          var last = msgs.length ? msgs[msgs.length - 1] : null;
          var unread = last && last.role === 'customer';
          return '<div class="tab' + (id === currentSessionId ? ' active' : '') + '" data-tab="' + esc(id) + '">' +
            (unread ? '<span class="tab__dot"></span>' : '') +
            '<span class="tab__name">' + esc(name) + '</span>' +
            '<span class="tab__close" data-close="' + esc(id) + '">×</span>' +
            '</div>';
        }).join('');
      }

      /* ---- 聊天区 ---- */
      function renderChat(id) {
        currentSessionId = id;
        openTab(id);
        var s = readSessions()[id];
        var chatEl = document.getElementById('chatBody');
        var titleParts = [];
        if (s) { titleParts.push(s.name || '顾客'); if (s.phone) titleParts.push(s.phone); if (s.productLine) titleParts.push(s.productLine); }
        document.getElementById('chatTitle').textContent = titleParts.join(' · ') || '会话';
        if (!s || !s.messages || !s.messages.length) {
          chatEl.innerHTML = '<div class="empty">暂无消息</div>';
          return;
        }
        var msgs = s.messages.slice().sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
        chatEl.innerHTML = msgs.map(function (m) {
          var cls = m.role === 'agent' ? 'agent' : (m.role === 'customer' ? 'customer' : 'sys');
          var sender = m.role === 'agent' ? '客服' : (m.role === 'customer' ? '顾客' : '系统');
          var time = m.ts ? new Date(m.ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
          return '<div class="bubble bubble--' + cls + '">' +
            '<div class="bubble__meta"><span class="bubble__sender">' + sender + '</span>' +
            (time ? '<span class="bubble__time">' + time + '</span>' : '') + '</div>' +
            '<div class="bubble__content">' + esc(m.content) + '</div>' +
            '</div>';
        }).join('');
        chatEl.scrollTop = chatEl.scrollHeight;
        renderList();
        renderTabs();
      }

      function clearAllSessions() {
        if (!confirm('确定清空所有会话记录吗？此操作不可恢复。')) return;
        writeSessions({});
        currentSessionId = null;
        openTabs = [];
        document.getElementById('chatTitle').textContent = '请选择左侧会话';
        document.getElementById('chatBody').innerHTML = '<div class="empty">暂无消息</div>';
        renderTabs();
        renderList();
      }

      function sendReply() {
        if (!currentSessionId) return;
        var input = document.getElementById('replyInput');
        var text = input.value.trim();
        if (!text) return;
        var s = readSessions()[currentSessionId];
        if (!s) return;
        s.messages = s.messages || [];
        s.messages.push({ role: 'agent', content: text, ts: Date.now() });
        s.updatedAt = Date.now();
        upsert(s);
        input.value = '';
        renderChat(currentSessionId);
      }

      /* ---- 事件 ---- */
      document.getElementById('loginBtn').addEventListener('click', doLogin);
      document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doLogin();
      });
      document.getElementById('logoutBtn').addEventListener('click', showLogin);
      document.getElementById('clearSessionsBtn').addEventListener('click', clearAllSessions);
      document.getElementById('sendReplyBtn').addEventListener('click', sendReply);
      document.getElementById('replyInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') sendReply();
      });
      document.getElementById('sessionList').addEventListener('click', function (e) {
        var btn = e.target.closest('.sess');
        if (btn) renderChat(btn.getAttribute('data-id'));
      });
      // 标签页点击：切换会话 / 关闭标签
      document.getElementById('tabBar').addEventListener('click', function (e) {
        var closeBtn = e.target.closest('.tab__close');
        if (closeBtn) { e.stopPropagation(); closeTab(closeBtn.getAttribute('data-close')); return; }
        var tab = e.target.closest('.tab');
        if (tab) renderChat(tab.getAttribute('data-tab'));
      });
      document.getElementById('quickReplies').addEventListener('click', function (e) {
        var btn = e.target.closest('.chat__quick button');
        if (!btn) return;
        var input = document.getElementById('replyInput');
        input.value = btn.getAttribute('data-reply');
        input.focus();
      });

      // 跨设备实时同步：轮询拉取变更后刷新列表与当前会话
      function applyRemote(all) {
        if (all && typeof all === 'object') {
          localStorage.setItem(SESSIONS_KEY, JSON.stringify(all));
        }
        renderList();
        if (currentSessionId) renderChat(currentSessionId);
      }
      function pullRemote() {
        window.JC.getSessions().then(applyRemote);
      }
      pullRemote();
      setInterval(pullRemote, 5000);

      // 已登录则直接进入工作台
      if (sessionStorage.getItem(AUTH_KEY) === '1') showWorkbench();
    })();
  </script>
</body>
</html>
